server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scfs?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:scfs}
    password: ${DB_PASSWORD:scfs_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

app:
  jwt-secret: ${JWT_SECRET:change-this-demo-secret-before-production}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  upload-dir: ${UPLOAD_DIR:uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  email-api:
    provider: ${EMAIL_API_PROVIDER:resend}
    resend:
      api-key: ${RESEND_API_KEY:}
      from-address: ${RESEND_FROM_ADDRESS:Complaint System <onboarding@resend.dev>}
      endpoint: ${RESEND_API_ENDPOINT:https://api.resend.com/emails}
