services:
  mysql:
    image: mysql:8.4
    container_name: scfs-mysql
    environment:
      MYSQL_DATABASE: scfs
      MYSQL_USER: scfs
      MYSQL_PASSWORD: scfs_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - scfs_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  scfs_mysql_data:

